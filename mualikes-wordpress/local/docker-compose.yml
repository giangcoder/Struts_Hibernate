# WordPress local cho MuaLikes: http://localhost:8080  (admin: admin / admin123)
name: mualikes-local

services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: rootpass
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    image: wordpress:6.6-php8.2-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG', true);
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
    volumes:
      - wp_data:/var/www/html
      - ../theme/mualikes:/var/www/html/wp-content/themes/mualikes
      - ../plugin/mualikes-core:/var/www/html/wp-content/plugins/mualikes-core

  wpcli:
    image: wordpress:cli-php8.2
    profiles: ["cli"]
    user: "33:33"
    depends_on:
      - wordpress
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp_data:/var/www/html
      - ../theme/mualikes:/var/www/html/wp-content/themes/mualikes
      - ../plugin/mualikes-core:/var/www/html/wp-content/plugins/mualikes-core
      - ./setup.sh:/setup.sh:ro
    entrypoint: ["sh", "/setup.sh"]

volumes:
  db_data:
  wp_data:
